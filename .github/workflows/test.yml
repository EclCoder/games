name: Download and Check APK

on:
  workflow_dispatch:

jobs:
  download-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        run: |
          curl -L --fail --retry 3 \
            -o vn-video-editor.apk \
            "https://download.gamercdn.top/download/vn-video-editor-1-v2.9.1-MOD-gamekillerapp.com.apk"

      - name: Show APK information
        run: |
          echo "=== APK ==="
          ls -lh vn-video-editor.apk
          file vn-video-editor.apk

          echo
          echo "=== SHA-256 ==="
          sha256sum vn-video-editor.apk

      - name: Check APK architecture
        run: |
          mkdir -p extracted

          unzip -q vn-video-editor.apk \
            'lib/*.so' \
            -d extracted || true

          echo "=== Native libraries ==="

          if [ -d "extracted/lib" ]; then
            find extracted/lib \
              -type f \
              -name "*.so" \
              -exec file {} \;
          else
            echo "No native libraries found."
          fi

          echo
          echo "=== ABI directories ==="

          if [ -d "extracted/lib/armeabi-v7a" ]; then
            echo "ARMv7 (armeabi-v7a): YES"
          else
            echo "ARMv7 (armeabi-v7a): NO"
          fi

          if [ -d "extracted/lib/arm64-v8a" ]; then
            echo "ARM64 (arm64-v8a): YES"
          else
            echo "ARM64 (arm64-v8a): NO"
          fi

          if [ -d "extracted/lib/x86" ]; then
            echo "x86: YES"
          else
            echo "x86: NO"
          fi

          if [ -d "extracted/lib/x86_64" ]; then
            echo "x86_64: YES"
          else
            echo "x86_64: NO"
          fi