name: Download and Check APK

on:
  push:

jobs:
  download-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        run: |
          curl -L --fail --retry 3 \
            -o app.apk \
            "https://archive.org/download/alight-motion-v-5.0.249.1002172/Alight_Motion_v5.0.249.1002172.apk"

      - name: Show APK information
        run: |
          echo "=== APK ==="
          ls -lh app.apk
          file app.apk

          echo
          echo "=== SHA-256 ==="
          sha256sum app.apk

      - name: Check APK architecture
        run: |
          mkdir -p extracted

          unzip -q app.apk \
            'lib/*.so' \
            -d extracted || true

          echo "=== Native libraries ==="

          if [ -d "extracted/lib" ]; then
            find extracted/lib \
              -type f \
              -name "*.so" \
              -exec file {} \;
          else
            echo "No native libraries found."
          fi

          echo
          echo "=== ABI directories ==="

          if [ -d "extracted/lib/armeabi-v7a" ]; then
            echo "ARMv7 (armeabi-v7a): YES"
          else
            echo "ARMv7 (armeabi-v7a): NO"
          fi

          if [ -d "extracted/lib/arm64-v8a" ]; then
            echo "ARM64 (arm64-v8a): YES"
          else
            echo "ARM64 (arm64-v8a): NO"
          fi

          if [ -d "extracted/lib/x86" ]; then
            echo "x86: YES"
          else
            echo "x86: NO"
          fi

          if [ -d "extracted/lib/x86_64" ]; then
            echo "x86_64: YES"
          else
            echo "x86_64: NO"
          fi