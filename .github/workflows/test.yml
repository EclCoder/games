name: Download and Check APK

on:
  push:

jobs:
  download-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        run: |
          curl -L --fail --retry 3 \
            -o app.apk \
            "https://archive.org/download/kinemaster-pro-v-4.13.4-techyminati.com/Kinemaster%20Pro%20v4.13.4%20%5Btechyminati.com%5D.apk"

      - name: Show APK information
        run: |
          echo "=== APK ==="
          ls -lh app.apk
          file app.apk

          echo
          echo "=== SHA-256 ==="
          sha256sum app.apk

      - name: Check APK architecture
        run: |
          mkdir -p extracted

          unzip -q app.apk \
            'lib/*.so' \
            -d extracted || true

          echo "=== Native libraries ==="

          if [ -d "extracted/lib" ]; then
            find extracted/lib \
              -type f \
              -name "*.so" \
              -exec file {} \;
          else
            echo "No native libraries found."
          fi

          echo
          echo "=== ABI directories ==="

          if [ -d "extracted/lib/armeabi-v7a" ]; then
            echo "ARMv7 (armeabi-v7a): YES"
          else
            echo "ARMv7 (armeabi-v7a): NO"
          fi

          if [ -d "extracted/lib/arm64-v8a" ]; then
            echo "ARM64 (arm64-v8a): YES"
          else
            echo "ARM64 (arm64-v8a): NO"
          fi

          if [ -d "extracted/lib/x86" ]; then
            echo "x86: YES"
          else
            echo "x86: NO"
          fi

          if [ -d "extracted/lib/x86_64" ]; then
            echo "x86_64: YES"
          else
            echo "x86_64: NO"
          fi

      - name: Upload APK to VirusTotal
        id: virustotal-upload
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          echo "=== Uploading to VirusTotal ==="

          RESPONSE=$(curl --fail \
            --request POST \
            --url "https://www.virustotal.com/api/v3/files" \
            --header "x-apikey: ${VT_API_KEY}" \
            --form "file=@app.apk")

          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id')

          if [ "$ANALYSIS_ID" = "null" ] || [ -z "$ANALYSIS_ID" ]; then
            echo "Failed to get VirusTotal analysis ID."
            echo "$RESPONSE"
            exit 1
          fi

          echo "Analysis ID: $ANALYSIS_ID"
          echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for VirusTotal scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ANALYSIS_ID: ${{ steps.virustotal-upload.outputs.analysis_id }}
        run: |
          echo "=== Waiting for VirusTotal analysis ==="

          for i in {1..30}; do
            RESPONSE=$(curl --fail \
              --request GET \
              --url "https://www.virustotal.com/api/v3/analyses/${ANALYSIS_ID}" \
              --header "x-apikey: ${VT_API_KEY}")

            STATUS=$(echo "$RESPONSE" | jq -r '.data.attributes.status')

            echo "Attempt $i/30 - Status: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "VirusTotal analysis completed."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "VirusTotal analysis did not finish within the timeout."
              exit 1
            fi

            sleep 10
          done

      - name: Get VirusTotal file link
        run: |
          SHA256=$(sha256sum app.apk | awk '{print $1}')

          echo
          echo "=========================================="
          echo "VirusTotal scan:"
          echo "https://www.virustotal.com/gui/file/${SHA256}"
          echo "=========================================="